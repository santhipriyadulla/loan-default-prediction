<!DOCTYPE html>
<html>

<head>
    <title>Loan Default Prediction</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #fce4ec);
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffffcc;
            backdrop-filter: blur(10px);
            padding: 30px;
            width: 320px;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h2 {
            color: #444;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #90caf9;
            box-shadow: 0px 0px 5px #90caf9;
        }

        button {
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #64b5f6, #ba68c8);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #42a5f5, #ab47bc);
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .safe {
            color: #2e7d32;
        }

        .risk {
            color: #c62828;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>💳 Loan Risk Predictor</h2>

        <input type="number" id="age" placeholder="Enter Age">
        <input type="number" id="income" placeholder="Enter Income">
        <input type="number" id="loanamount" placeholder="Loan Amount">
        <input type="number" id="creditscore" placeholder="Credit Score">

        <button onclick="predict()">Predict</button>

        <h3 id="result"></h3>

    </div>

    <script>
        async function predict() {

            let age = document.getElementById("age").value;
            let income = document.getElementById("income").value;
            let loanamount = document.getElementById("loanamount").value;
            let creditscore = document.getElementById("creditscore").value;

            if (!age || !income || !loanamount || !creditscore) {
                alert("Please fill all fields");
                return;
            }

            let data = {
                age: Number(age),
                income: Number(income),
                loanamount: Number(loanamount),
                creditscore: Number(creditscore)
            };

            try {
                let response = await fetch("https://loan-api-fltv.onrender.com/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                let result = await response.json();

                let resultText = document.getElementById("result");

                if (result.prediction == 1) {
                    resultText.innerText = "⚠️ High Risk (Default)";
                    resultText.className = "risk";
                } else {
                    resultText.innerText = "✅ Low Risk (Safe)";
                    resultText.className = "safe";
                }

            } catch (error) {
                document.getElementById("result").innerText = "Server Error";
            }
        }
    </script>

</body>
</html>
