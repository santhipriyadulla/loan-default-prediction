<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loan Risk Predictor</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>

/* BACKGROUND */
body {
margin:0;
font-family:Poppins, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background: linear-gradient(135deg,#667eea,#764ba2,#ff758c);
background-size:300% 300%;
animation:bg 10s infinite;
}

@keyframes bg {
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* CARD */
.card {
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
width:330px;
text-align:center;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
color:white;
}

/* INPUT */
.input-group {
text-align:left;
margin-bottom:10px;
}

.input-group label {
font-size:12px;
color:#ddd;
margin-left:5px;
}

.input-box {
display:flex;
align-items:center;
background:white;
border-radius:10px;
margin:5px 0;
padding:10px;
}

.input-box i {
margin-right:10px;
color:#555;
}

.input-box input {
border:none;
outline:none;
width:100%;
}

/* EXAMPLES */
.examples{
font-size:11px;
color:#eee;
margin-top:10px;
text-align:left;
line-height:1.5;
}

/* BUTTON */
button {
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#00c6ff,#0072ff);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover {
transform:scale(1.05);
background:linear-gradient(45deg,#ff758c,#ff7eb3);
}

/* RESULT */
#result {
margin-top:15px;
font-size:18px;
font-weight:bold;
}

.safe { color:#00ffcc; }
.risky { color:#ff4d4d; }

/* LOADER */
.loader {
border:4px solid #f3f3f3;
border-top:4px solid #00c6ff;
border-radius:50%;
width:25px;
height:25px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin {
100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div class="card">

<h2>💳 Loan Risk Predictor</h2>

<div class="input-group">
<label>Age</label>
<div class="input-box">
<i class="fa fa-user"></i>
<input id="age" type="number">
</div>
</div>

<div class="input-group">
<label>Income</label>
<div class="input-box">
<i class="fa fa-dollar-sign"></i>
<input id="income" type="number">
</div>
</div>

<div class="input-group">
<label>Loan Amount</label>
<div class="input-box">
<i class="fa fa-money-bill"></i>
<input id="loan" type="number">
</div>
</div>

<div class="input-group">
<label>Credit Score</label>
<div class="input-box">
<i class="fa fa-chart-line"></i>
<input id="score" type="number">
</div>
</div>

<button onclick="predict()">Predict</button>

<p id="result"></p>

<!-- TEXTBOOK EXAMPLES -->
<div class="examples">

<b>Example Inputs:</b><br>

Low Risk Example<br>
Age: 35 | Income: 80000 | Loan: 15000 | Credit Score: 750<br><br>

High Risk Example<br>
Age: 22 | Income: 20000 | Loan: 40000 | Credit Score: 450

</div>

</div>

<!-- ALARM SOUND -->
<audio id="alarm">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>

async function predict() {

const result = document.getElementById("result");

// Loader
result.innerHTML = '<div class="loader"></div>';

let age = document.getElementById("age").value;
let income = document.getElementById("income").value;
let loan = document.getElementById("loan").value;
let score = document.getElementById("score").value;

if(!age || !income || !loan || !score){
result.innerHTML="Please enter all values";
return;
}

let data = {
age:Number(age),
income:Number(income),
loanamount:Number(loan),
creditscore:Number(score)
};

try {

let response = await fetch("https://loan-api-fltv.onrender.com/predict",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

let res = await response.json();

if(res.prediction === 0){

result.innerHTML = "✔ Low Risk (Safe)";
result.className = "safe";

}

else{

result.innerHTML = "❌ High Risk (Risky)";
result.className = "risky";

/* PLAY ALARM SOUND */
document.getElementById("alarm").play();

}

}

catch(error){

result.innerHTML="Server Error";

}

}

</script>

</body>
</html>
