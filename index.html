<!DOCTYPE html>
<html>

<head>
    <title>Loan Default Prediction</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f6fc;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px;
            width: 100%;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Loan Default Prediction</h2>

        <!-- INPUTS -->
        <input type="number" id="age" placeholder="Enter Age">

        <input type="number" id="income" placeholder="Enter Income">

        <input type="number" id="loanamount" placeholder="Loan Amount">

        <input type="number" id="creditscore" placeholder="Credit Score">

        <!-- BUTTON -->
        <button onclick="predict()">Predict</button>

        <!-- RESULT -->
        <h3 id="result"></h3>

    </div>

    <script>
        async function predict() {

            // GET VALUES
            let age = document.getElementById("age").value;
            let income = document.getElementById("income").value;
            let loanamount = document.getElementById("loanamount").value;
            let creditscore = document.getElementById("creditscore").value;

            // VALIDATION
            if (!age || !income || !loanamount || !creditscore) {
                alert("Please fill all fields");
                return;
            }

            // CREATE DATA
            let data = {
                age: Number(age),
                income: Number(income),
                loanamount: Number(loanamount),
                creditscore: Number(creditscore)
            };

            try {
                // SEND REQUEST
                let response = await fetch("https://loan-api-fltv.onrender.com/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                let result = await response.json();

                // SHOW RESULT
                document.getElementById("result").innerText =
                    result.prediction == 1 ? "⚠️ High Risk (Default)" : "✅ Low Risk (Safe)";

            } catch (error) {
                document.getElementById("result").innerText = "Error connecting to server";
            }
        }
    </script>

</body>
</html>
